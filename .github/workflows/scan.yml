name: Scan for engulfing alerts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/scan
        run: |
          curl -sf -X GET "${{ secrets.SCAN_URL }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
