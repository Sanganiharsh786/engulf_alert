<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Engulfing Dashboard — Architecture</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font:
      14px/1.4 ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }
  main {
    max-width: 980px;
    margin: 32px auto;
    padding: 0 20px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .title {
    font-size: 20px;
    font-weight: 650;
    fill: var(--fg);
  }
  .label {
    font-size: 14px;
    font-weight: 600;
    fill: var(--fg);
  }
  .small {
    font-size: 12px;
    fill: var(--muted);
  }
  .node {
    stroke: var(--line);
    stroke-width: 1;
  }
  .neutral { fill: var(--neutral); }
  .input { fill: var(--input); }
  .process { fill: var(--process); }
  .storage { fill: var(--storage); }
  .external { fill: var(--external); }
  .risk { fill: var(--risk); }
  .edge {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
  }
  .zone {
    fill: none;
    stroke: var(--line);
    stroke-width: 1;
    stroke-dasharray: 6 5;
    opacity: 0.8;
  }
</style>
<main>
  <svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Engulfing Dashboard architecture">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M1 1L9 5L1 9" fill="none" stroke="var(--line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      </marker>
    </defs>

    <!-- ===== connectors first (sit behind nodes) ===== -->
    <path class="edge" d="M190 116 L190 150" marker-end="url(#arrow)" />
    <path class="edge" d="M480 116 L480 150" marker-end="url(#arrow)" />
    <path class="edge" d="M770 116 L770 150" marker-end="url(#arrow)" />
    <path class="edge" d="M480 260 L480 300" marker-end="url(#arrow)" />
    <path class="edge" d="M480 410 L480 450" marker-end="url(#arrow)" />

    <text class="title" x="40" y="34">Engulfing Dashboard — system architecture</text>

    <!-- ===== Tier 1: clients / triggers ===== -->
    <rect class="node input" x="60" y="60" width="260" height="56" rx="10" />
    <text class="label" x="190" y="84" text-anchor="middle">Browser dashboard</text>
    <text class="small" x="190" y="102" text-anchor="middle">live scan + backtest UI</text>

    <rect class="node input" x="350" y="60" width="260" height="56" rx="10" />
    <text class="label" x="480" y="84" text-anchor="middle">Cron scheduler</text>
    <text class="small" x="480" y="102" text-anchor="middle">GitHub Actions / Vercel</text>

    <rect class="node input" x="640" y="60" width="260" height="56" rx="10" />
    <text class="label" x="770" y="84" text-anchor="middle">Standalone worker</text>
    <text class="small" x="770" y="102" text-anchor="middle">worker.mjs — 24/7 loop</text>

    <!-- ===== Tier 2: Next.js API routes ===== -->
    <rect class="zone" x="40" y="150" width="880" height="110" rx="14" />
    <text class="label" x="56" y="172">Next.js API routes (app/api) + middleware auth</text>

    <rect class="node process" x="60" y="185" width="200" height="54" rx="8" />
    <text class="label" x="160" y="209" text-anchor="middle">Scan &amp; alerts</text>
    <text class="small" x="160" y="226" text-anchor="middle">scan, alerts, fvg, crt</text>

    <rect class="node process" x="273" y="185" width="200" height="54" rx="8" />
    <text class="label" x="373" y="209" text-anchor="middle">Backtest</text>
    <text class="small" x="373" y="226" text-anchor="middle">backtest, crt, zone</text>

    <rect class="node process" x="486" y="185" width="200" height="54" rx="8" />
    <text class="label" x="586" y="209" text-anchor="middle">Config &amp; data</text>
    <text class="small" x="586" y="226" text-anchor="middle">config, history, candles</text>

    <rect class="node process" x="699" y="185" width="200" height="54" rx="8" />
    <text class="label" x="799" y="209" text-anchor="middle">Auth &amp; tests</text>
    <text class="small" x="799" y="226" text-anchor="middle">login, logout, tests</text>

    <!-- ===== Tier 3: core engine ===== -->
    <rect class="zone" x="40" y="300" width="880" height="110" rx="14" />
    <text class="label" x="56" y="322">Core engine (lib/) — pure logic</text>

    <rect class="node process" x="60" y="335" width="200" height="54" rx="8" />
    <text class="label" x="160" y="359" text-anchor="middle">Detection</text>
    <text class="small" x="160" y="376" text-anchor="middle">engulfing, fvg, crt, dna</text>

    <rect class="node process" x="273" y="335" width="200" height="54" rx="8" />
    <text class="label" x="373" y="359" text-anchor="middle">Backtest engines</text>
    <text class="small" x="373" y="376" text-anchor="middle">backtest, crt, zone bt</text>

    <rect class="node process" x="486" y="335" width="200" height="54" rx="8" />
    <text class="label" x="586" y="359" text-anchor="middle">Market + storage</text>
    <text class="small" x="586" y="376" text-anchor="middle">market, store, auth</text>

    <rect class="node process" x="699" y="335" width="200" height="54" rx="8" />
    <text class="label" x="799" y="359" text-anchor="middle">Notify + charts</text>
    <text class="small" x="799" y="376" text-anchor="middle">mailer, telegram, chart</text>

    <!-- ===== Tier 4: external services ===== -->
    <rect class="node external" x="60" y="450" width="200" height="56" rx="8" />
    <text class="label" x="160" y="474" text-anchor="middle">Binance / ccxt</text>
    <text class="small" x="160" y="492" text-anchor="middle">OHLCV market data</text>

    <rect class="node external" x="273" y="450" width="200" height="56" rx="8" />
    <text class="label" x="373" y="474" text-anchor="middle">Telegram Bot</text>
    <text class="small" x="373" y="492" text-anchor="middle">photo + text alerts</text>

    <rect class="node external" x="486" y="450" width="200" height="56" rx="8" />
    <text class="label" x="586" y="474" text-anchor="middle">SMTP / Gmail</text>
    <text class="small" x="586" y="492" text-anchor="middle">email alerts</text>

    <rect class="node storage" x="699" y="450" width="200" height="56" rx="8" />
    <text class="label" x="799" y="474" text-anchor="middle">Upstash Redis</text>
    <text class="small" x="799" y="492" text-anchor="middle">store persistence</text>

    <!-- ===== legend ===== -->
    <rect class="node input" x="60" y="560" width="18" height="18" rx="4" />
    <text class="small" x="86" y="574">Clients / triggers</text>
    <rect class="node process" x="230" y="560" width="18" height="18" rx="4" />
    <text class="small" x="256" y="574">App logic</text>
    <rect class="node external" x="360" y="560" width="18" height="18" rx="4" />
    <text class="small" x="386" y="574">External service</text>
    <rect class="node storage" x="540" y="560" width="18" height="18" rx="4" />
    <text class="small" x="566" y="574">Storage</text>
  </svg>
</main>
